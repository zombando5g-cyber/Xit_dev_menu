<!DOCTYPE html>
<html lang="pt‑BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1.0">
<title>FF - Otimizador de Desempenho</title>
<style>
*{box-sizing:border-box;font-family:"Arial Black",sans-serif;margin:0;padding:0}
body{background:#121212;color:#fff;padding:24px;max-width:420px;margin:30px auto;background-image:radial-gradient(circle at top,#ff4500 8%,transparent 30%)}
h1{text-align:center;margin-bottom:30px;font-size:24px;color:#ff4500;text-shadow:2px 2px #000}
.bloco{background:#1e1e1e;border:2px solid #ff4500;padding:20px;border-radius:12px;margin-bottom:20px}
.titulo-bloco{margin-bottom:14px;font-size:18px;color:#ffcc00}
.opcoes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.btn-opcao{padding:11px 13px;border:2px solid #ff4500;border-radius:8px;background:#2b2b2b;color:#ffcc00;font-weight:bold;cursor:pointer}
.btn-opcao.selecionado{background:#ff4500;color:#fff}
#btn-otimizar{width:100%;padding:15px;border:none;border-radius:10px;background:linear-gradient(90deg,#ff4500,#ffaa00);color:#000;font-weight:bold;font-size:18px;margin-top:12px;text-transform:uppercase}
#status{margin-top:16px;text-align:center;font-size:15px;color:#ffcc66}
</style>
</head>
<body>
<h1>🔥 OTIMIZADOR FREESTYL 🔥</h1>

<div class="bloco">
  <div class="titulo-bloco">⚡ Taxa de quadros</div>
  <div class="opcoes">
    <button class="btn-opcao" data-valor="90">90 FPS</button>
    <button class="btn-opcao" data-valor="120">120 FPS</button>
    <button class="btn-opcao" data-valor="144">144 FPS</button>
    <button class="btn-opcao" data-valor="300">300 FPS</button>
  </div>

  <div class="titulo-bloco">📺 V‑Sync</div>
  <div class="opcoes">
    <button class="btn-opcao vsync" data-valor="on">ON</button>
    <button class="btn-opcao vsync" data-valor="off">OFF</button>
  </div>

  <div class="titulo-bloco">🎮 MODO HS</div>
  <div class="opcoes">
    <button class="btn-opcao hs" data-valor="emu">EMU</button>
    <button class="btn-opcao hs" data-valor="mob">MOB</button>
  </div>

  <button id="btn-otimizar">OTIMIZAR</button>
  <div id="status">🔒 Risco de super aquecimento</div>
</div>

<script>
let fpsEscolhido = null;
let vsyncEscolhido = null;
let hsEscolhido = null;

document.querySelectorAll('.btn-opcao:not(.vsync):not(.hs)').forEach(botao=>{
  botao.addEventListener('click',()=>{
    document.querySelectorAll('.btn-opcao:not(.vsync):not(.hs)').forEach(b=>b.classList.remove('selecionado'));
    botao.classList.add('selecionado');
    fpsEscolhido = botao.dataset.valor;
  })
})

document.querySelectorAll('.btn-opcao.vsync').forEach(botao=>{
  botao.addEventListener('click',()=>{
    document.querySelectorAll('.btn-opcao.vsync').forEach(b=>b.classList.remove('selecionado'));
    botao.classList.add('selecionado');
    vsyncEscolhido = botao.dataset.valor;
  })
})

document.querySelectorAll('.btn-opcao.hs').forEach(botao=>{
  botao.addEventListener('click',()=>{
    document.querySelectorAll('.btn-opcao.hs').forEach(b=>b.classList.remove('selecionado'));
    botao.classList.add('selecionado');
    hsEscolhido = botao.dataset.valor;
  })
})

document.getElementById('btn-otimizar').addEventListener('click',()=>{
  const statusEl = document.getElementById('status');
  if(!fpsEscolhido || !vsyncEscolhido || !hsEscolhido){
    statusEl.textContent = "⚠️ Escolha todas as opções primeiro!";
    return;
  }
  statusEl.textContent = `✅ Config: ${fpsEscolhido}FPS | V‑Sync ${vsyncEscolhido} | Modo HS ${hsEscolhido}`;
})
</script>
</body>
</html>
